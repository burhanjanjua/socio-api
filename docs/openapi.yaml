openapi: 3.0.3
info:
  title: Socio API
  version: 1.0.0
  description: API documentation for the Socio Laravel backend.
servers:
  - url: http://localhost:8000/api
    description: Local development

tags:
  - name: Auth
  - name: Posts
  - name: Me
  - name: Admin

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/admin/login:
    post:
      tags: [Auth]
      summary: Login an admin user
      description: Returns 403 if the user is not an admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /posts:
    get:
      tags: [Posts]
      summary: List published posts
      parameters:
        - $ref: '#/components/parameters/PageParam'
      responses:
        '200':
          description: Paginated list of published posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPosts'

  /posts/{slug}:
    get:
      tags: [Posts]
      summary: Get a post by slug
      description: Drafts require authentication and either admin access or ownership.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /me/posts:
    get:
      tags: [Me]
      summary: List current user's posts
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
      responses:
        '200':
          description: Paginated list of posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPosts'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      tags: [Me]
      summary: Create a post for the current user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserPostCreateRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/UserPostCreateRequest'
      responses:
        '201':
          description: Post created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/posts/{postId}:
    patch:
      tags: [Me]
      summary: Update a post owned by the current user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostIdParam'
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserPostUpdateRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/UserPostUpdateRequest'
      responses:
        '200':
          description: Post updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      tags: [Me]
      summary: Delete a post owned by the current user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostIdParam'
      responses:
        '200':
          description: Post deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /admin/posts:
    get:
      tags: [Admin]
      summary: List all posts (admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
      responses:
        '200':
          description: Paginated list of posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPosts'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

    post:
      tags: [Admin]
      summary: Create a post (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminPostCreateRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPostCreateRequest'
      responses:
        '201':
          description: Post created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/posts/{postId}:
    patch:
      tags: [Admin]
      summary: Update a post (admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostIdParam'
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminPostUpdateRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPostUpdateRequest'
      responses:
        '200':
          description: Post updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      tags: [Admin]
      summary: Delete a post (admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostIdParam'
      responses:
        '200':
          description: Post deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  parameters:
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    PostIdParam:
      name: postId
      in: path
      required: true
      schema:
        type: integer

  responses:
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          examples:
            unauthorized:
              value:
                message: Unauthenticated.
    ForbiddenError:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          examples:
            forbidden:
              value:
                message: Admin access required.
    NotFoundError:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          examples:
            notFound:
              value:
                message: Post not found.
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'

  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
        password_confirmation:
          type: string
          format: password

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    UserPostCreateRequest:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
          maxLength: 255
        excerpt:
          type: string
          nullable: true
        body:
          type: string
        published_at:
          type: string
          format: date-time
          nullable: true
        image:
          type: string
          format: binary
          nullable: true

    UserPostUpdateRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        excerpt:
          type: string
          nullable: true
        body:
          type: string
        published_at:
          type: string
          format: date-time
          nullable: true
        image:
          type: string
          format: binary
          nullable: true

    AdminPostCreateRequest:
      type: object
      required: [title, body]
      properties:
        author_id:
          type: integer
          nullable: true
        title:
          type: string
          maxLength: 255
        excerpt:
          type: string
          nullable: true
        body:
          type: string
        published_at:
          type: string
          format: date-time
          nullable: true
        image:
          type: string
          format: binary
          nullable: true

    AdminPostUpdateRequest:
      type: object
      properties:
        author_id:
          type: integer
          nullable: true
        title:
          type: string
          maxLength: 255
        excerpt:
          type: string
          nullable: true
        body:
          type: string
        published_at:
          type: string
          format: date-time
          nullable: true
        image:
          type: string
          format: binary
          nullable: true

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      required: [id, name, email, role, created_at, updated_at]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Author:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string

    Post:
      type: object
      required:
        - id
        - user_id
        - title
        - slug
        - body
        - created_at
        - updated_at
        - is_published
      properties:
        id:
          type: integer
        user_id:
          type: integer
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
          nullable: true
        body:
          type: string
        image_path:
          type: string
          nullable: true
        image_url:
          type: string
          format: uri
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        is_published:
          type: boolean
        author:
          $ref: '#/components/schemas/Author'

    PaginatedPosts:
      type: object
      required: [current_page, data, per_page, total]
      properties:
        current_page:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/Post'
        first_page_url:
          type: string
          nullable: true
        from:
          type: integer
          nullable: true
        last_page:
          type: integer
        last_page_url:
          type: string
          nullable: true
        links:
          type: array
          items:
            $ref: '#/components/schemas/PaginationLink'
        next_page_url:
          type: string
          nullable: true
        path:
          type: string
        per_page:
          type: integer
        prev_page_url:
          type: string
          nullable: true
        to:
          type: integer
          nullable: true
        total:
          type: integer

    PaginationLink:
      type: object
      required: [label, active]
      properties:
        url:
          type: string
          nullable: true
        label:
          type: string
        active:
          type: boolean

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
